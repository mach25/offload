[package]
name = "offload-transport"
description = "Connections between Offload nodes, addressed by node key rather than by address."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
offload-core = { workspace = true }
offload-proto = { path = "../offload-proto" }
async-trait = { workspace = true }
ed25519-dalek = { workspace = true }
mdns-sd = { version = "0.20", default-features = false, features = ["async"] }
# Already in the build through mdns-sd; used directly to list the addresses gossiped (ADR-0076).
if-addrs = "0.15"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { workspace = true }
# `[::]` is dual-stack only with `IPV6_V6ONLY` off, and std cannot set it before binding. Already in
# the tree through quinn and mdns-sd.
socket2 = "0.6"
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "io-util", "macros", "net", "time"] }
tracing = { workspace = true }

# One constant, `EMSGSIZE`, so that `sends.rs` can tell quinn discovering the path MTU from the
# kernel refusing to speak. quinn-udp classifies it the same way and for the same reason.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ed25519-dalek = { workspace = true }
tokio = { version = "1", features = ["full"] }
# For `examples/udp_probe.rs` only: the layer under quinn, so a datagram can be sent the way
# quinn sends one — same syscall, same ECN marking — without TLS, certificates or a connection.
quinn-udp = "0.5"


[lints]
workspace = true
